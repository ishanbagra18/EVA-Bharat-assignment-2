services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: media-sequencer-backend
    ports:
      - "8085:8080"
    environment:
      - PORT=8080
      - DB_PATH=/root/data/sequencer.db
    volumes:
      - backend-data:/root/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: media-sequencer-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
